<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration & Login | ClaimX National Redressal Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              postMaroon: '#7B1E1E',
              postDark: '#521111',
              postLight: '#FDF8F8',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F4F5; }
      .mono-code { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white px-4 pt-4 pb-3 border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-md mx-auto flex justify-center items-center">
            <h1 class="text-xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                <span class="text-postMaroon text-2xl">🛡️</span> CLAIMX PORTAL
            </h1>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 py-8 w-full">
        
        <div class="bg-white border border-slate-300 rounded-xl shadow-md overflow-hidden">
            
            <!-- Tabs -->
            <div class="grid grid-cols-2 border-b border-slate-200 bg-slate-100 text-sm font-bold">
                <button type="button" id="tabSignup" onclick="window.switchTab('signup')" class="py-3.5 text-center border-b-4 border-postMaroon bg-white text-postMaroon transition">
                    📝 New Signup
                </button>
                <button type="button" id="tabLogin" onclick="window.switchTab('login')" class="py-3.5 text-center border-b-4 border-transparent text-slate-600 hover:text-postMaroon transition">
                    🔑 Login
                </button>
            </div>

            <div id="statusAlert" class="hidden mx-5 mt-5 p-3 rounded text-xs font-semibold border"></div>

            <!-- ========================================== -->
            <!-- A. SIGNUP FORM (Mobile + 6-Digit OTP)      -->
            <!-- ========================================== -->
            <form id="signupForm" class="p-5 sm:p-7 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Full Legal Name *</label>
                    <input type="text" id="fullName" required placeholder="e.g., Akash Morya" class="w-full border border-slate-300 border-b-2 border-b-postMaroon rounded px-3 py-2.5 text-sm focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">10-Digit Mobile Number *</label>
                    <div class="flex gap-2">
                        <div class="flex flex-1">
                            <span class="inline-flex items-center bg-slate-100 border border-r-0 border-slate-300 border-b-2 border-b-postMaroon rounded-l px-3 text-sm font-bold text-slate-700">+91</span>
                            <input type="tel" id="mobileNo" maxlength="10" pattern="[6-9][0-9]{9}" required placeholder="9876543210" class="w-full border border-slate-300 border-b-2 border-b-postMaroon rounded-r px-3 py-2.5 text-sm focus:outline-none">
                        </div>
                        <button type="button" id="sendOtpBtn" onclick="window.sendOTP()" class="bg-slate-900 hover:bg-black text-white font-bold text-xs px-3.5 py-2.5 rounded transition shrink-0">
                            Send OTP
                        </button>
                    </div>
                </div>

                <!-- OTP Box -->
                <div id="otpBox" class="hidden bg-postLight border border-postMaroon/30 rounded-lg p-3.5 space-y-2.5">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-postMaroon">Enter 6-Digit Mobile OTP *</label>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="otpInput" maxlength="6" inputmode="numeric" placeholder="• • • • • •" class="w-full border border-slate-300 border-b-2 border-b-postMaroon rounded px-3 py-2 text-center tracking-widest font-bold text-sm focus:outline-none bg-white mono-code">
                        <button type="button" id="verifyOtpBtn" onclick="window.verifyOTP()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-4 py-2 rounded transition shrink-0">
                            Verify
                        </button>
                    </div>
                    <p id="otpVerifiedBadge" class="hidden text-[11px] text-emerald-800 font-bold flex items-center gap-1">
                        <span>✔</span> Mobile Verified Successfully!
                    </p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Create Account Password *</label>
                    <input type="password" id="signupPassword" required minlength="6" placeholder="Min. 6 characters" class="w-full border border-slate-300 border-b-2 border-b-postMaroon rounded px-3 py-2.5 text-sm focus:outline-none">
                </div>

                <button type="submit" id="signupBtn" class="w-full bg-postMaroon hover:bg-postDark text-white font-bold py-3.5 px-6 rounded-lg shadow transition text-sm mt-2">
                    REGISTER ACCOUNT &rarr;
                </button>
            </form>

            <!-- ========================================== -->
            <!-- B. LOGIN FORM                              -->
            <!-- ========================================== -->
            <form id="loginForm" class="hidden p-5 sm:p-7 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Registered Mobile Number *</label>
                    <div class="flex">
                        <span class="inline-flex items-center bg-slate-100 border border-r-0 border-slate-300 border-b-2 border-b-postMaroon rounded-l px-3 text-sm font-bold text-slate-700">+91</span>
                        <input type="tel" id="loginMobile" maxlength="10" pattern="[6-9][0-9]{9}" required placeholder="9876543210" class="w-full border border-slate-300 border-b-2 border-b-postMaroon rounded-r px-3 py-2.5 text-sm focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Security Password *</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password" class="w-full border border-slate-300 border-b-2 border-b-postMaroon rounded px-3 py-2.5 text-sm focus:outline-none">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-postMaroon hover:bg-postDark text-white font-bold py-3.5 px-6 rounded-lg shadow transition text-sm mt-2">
                    LOGIN TO PORTAL &rarr;
                </button>
            </form>
        </div>
    </main>

    <!-- FIREBASE & AUTH LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ✅ Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCxrpRzeThK7qEke2ZnFAblUbkBZinhjg8",
            authDomain: "claimx-acec5.firebaseapp.com",
            projectId: "claimx-acec5",
            storageBucket: "claimx-acec5.firebasestorage.app",
            messagingSenderId: "1004291276574",
            appId: "1:1004291276574:web:b7d51d5cb4ab33d390130f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let otpSessionId = null;
        let isOtpSent = false;
        let isOtpVerified = false;

        function showAlert(msg, isError = false) {
            const box = document.getElementById('statusAlert');
            box.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-300', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-300');
            box.classList.add(isError ? 'bg-red-50' : 'bg-emerald-50', isError ? 'text-red-800' : 'text-emerald-800', isError ? 'border-red-300' : 'border-emerald-300');
            box.innerHTML = msg;
        }

        window.switchTab = function(tab) {
            document.getElementById('statusAlert').classList.add('hidden');
            const sf = document.getElementById('signupForm'), lf = document.getElementById('loginForm');
            const ts = document.getElementById('tabSignup'), tl = document.getElementById('tabLogin');
            if (tab === 'signup') {
                sf.classList.remove('hidden'); lf.classList.add('hidden');
                ts.className = "py-3.5 text-center border-b-4 border-postMaroon bg-white text-postMaroon transition";
                tl.className = "py-3.5 text-center border-b-4 border-transparent text-slate-600 hover:text-postMaroon transition";
            } else {
                sf.classList.add('hidden'); lf.classList.remove('hidden');
                tl.className = "py-3.5 text-center border-b-4 border-postMaroon bg-white text-postMaroon transition";
                ts.className = "py-3.5 text-center border-b-4 border-transparent text-slate-600 hover:text-postMaroon transition";
            }
        };

        // 📲 1. SEND 6-DIGIT OTP
        window.sendOTP = async function() {
            const mobile = document.getElementById('mobileNo').value.trim();
            if (!/^[6-9]\d{9}$/.test(mobile)) {
                showAlert('❌ Please enter a valid 10-digit Mobile Number.', true); return;
            }

            const sendBtn = document.getElementById('sendOtpBtn');
            sendBtn.disabled = true; sendBtn.innerText = 'Sending...';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'send-otp', mobile: mobile })
                });
                const data = await res.json();
                
                if (data.success) {
                    otpSessionId = data.sessionId;
                    isOtpSent = true;
                    document.getElementById('otpBox').classList.remove('hidden');
                    sendBtn.innerText = 'Resend';
                    document.getElementById('mobileNo').readOnly = true;
                    showAlert(`📲 6-Digit OTP sent to +91-${mobile}.`, false);
                } else {
                    showAlert('❌ API Error: ' + data.error, true);
                    sendBtn.disabled = false; sendBtn.innerText = 'Send OTP';
                }
            } catch (err) {
                showAlert('❌ Connection error. Please check internet.', true);
                sendBtn.disabled = false; sendBtn.innerText = 'Send OTP';
            }
        };

        // ✔ 2. VERIFY 6-DIGIT OTP
        window.verifyOTP = async function() {
            const entered = document.getElementById('otpInput').value.trim();
            
            if (!isOtpSent || entered.length !== 6) {
                showAlert('❌ Please enter the exact 6-digit OTP received via SMS.', true); return;
            }

            const btn = document.getElementById('verifyOtpBtn');
            btn.disabled = true; btn.innerText = 'Checking...';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'verify-otp', otp: entered, sessionId: otpSessionId })
                });
                const data = await res.json();

                if (data.success) {
                    isOtpVerified = true;
                    document.getElementById('otpInput').disabled = true;
                    document.getElementById('verifyOtpBtn').classList.add('hidden');
                    document.getElementById('otpVerifiedBadge').classList.remove('hidden');
                    showAlert('✔ Mobile Verified! Enter password and click Register.', false);
                } else {
                    showAlert(`❌ ${data.error || 'Invalid or Expired OTP!'}`, true);
                    btn.disabled = false; btn.innerText = 'Verify';
                }
            } catch (err) {
                showAlert('❌ Verification error via server.', true);
                btn.disabled = false; btn.innerText = 'Verify';
            }
        };

        // 🚀 3. FIREBASE SIGNUP
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isOtpVerified) { showAlert('⚠️ Please verify your Mobile Number via OTP first.', true); return; }

            const fullName = document.getElementById('fullName').value.trim();
            const mobile = document.getElementById('mobileNo').value.trim();
            const password = document.getElementById('signupPassword').value;
            const firebaseEmail = `${mobile}@claimx.in`; 
            const citizenId = `CLX-CIT-${Math.floor(10000 + Math.random() * 90000)}`;

            const btn = document.getElementById('signupBtn');
            btn.disabled = true; btn.innerText = "CREATING ACCOUNT...";

            try {
                const userCred = await createUserWithEmailAndPassword(auth, firebaseEmail, password);
                const citizenData = {
                    uid: userCred.user.uid,
                    citizenId: citizenId,
                    fullName: fullName,
                    mobile: `+91${mobile}`,
                    role: "citizen",
                    createdAt: serverTimestamp()
                };
                await setDoc(doc(db, "citizens", userCred.user.uid), citizenData);
                localStorage.setItem('claimx_citizen', JSON.stringify(citizenData));

                showAlert(`✔ Registration Successful! Redirecting...`, false);
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } catch (error) {
                let msg = error.code === 'auth/email-already-in-use' ? "Mobile Number already registered! Please Login." : error.message;
                showAlert(`❌ Error: ${msg}`, true);
                btn.disabled = false; btn.innerText = "REGISTER ACCOUNT →";
            }
        });

        // 🔑 4. FIREBASE LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('loginMobile').value.trim();
            const password = document.getElementById('loginPassword').value;
            const firebaseEmail = `${mobile}@claimx.in`;

            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.innerText = "VERIFYING...";

            try {
                const userCred = await signInWithEmailAndPassword(auth, firebaseEmail, password);
                const docSnap = await getDoc(doc(db, "citizens", userCred.user.uid));
                if (docSnap.exists()) localStorage.setItem('claimx_citizen', JSON.stringify(docSnap.data()));

                showAlert(`✔ Login Verified! Redirecting...`, false);
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } catch (error) {
                showAlert("❌ Invalid Mobile Number or Password!", true);
                btn.disabled = false; btn.innerText = "LOGIN TO PORTAL →";
            }
        });
    </script>
</body>
</html>
